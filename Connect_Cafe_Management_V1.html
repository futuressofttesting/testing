function money(v){return `${data.settings.currency||'Rs.'} ${Number(v||0).toFixed(2)}`}
function pct(v){return `${Number(v||0).toFixed(1)}%`}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(prefix='id'){return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}
function ingredient(name){return data.ingredients.find(x=>x.name===name)}
function unitCost(name){const i=ingredient(name); return i&&i.purchaseQty?Number(i.purchaseCost||0)/Number(i.purchaseQty):0}
function recipeRows(drink){return data.recipes.filter(r=>r.drink===drink)}
function drinkCost(drink){return recipeRows(drink).reduce((s,r)=>s+Number(r.qty||0)*unitCost(r.ingredient),0)}
function menuItem(name){return data.menu.find(m=>m.name===name)}
function todayKey(d=new Date()){return d.toISOString().slice(0,10)}
function saleTotal(s){return Number(s.total||0)}
function todaySales(){const t=todayKey();return data.sales.filter(s=>s.date===t)}
function totalSales(){return data.sales.reduce((s,o)=>s+saleTotal(o),0)}
function salesCogs(){return data.sales.reduce((sum,o)=>sum+(o.items||[]).reduce((a,it)=>a+drinkCost(it.name)*it.qty,0),0)}
function expensesTotal(){return data.expenses.reduce((s,e)=>s+Number(e.amount||0),0)}
function wasteTotal(){return data.waste.reduce((s,w)=>s+Number(w.cost||0),0)}

    ${kpi('Today COGS',money(cogs),`Food cost ${sales?pct(cogs/sales*100):'0.0%'}`)}

  <div class="grid two" style="margin-top:16px">

    <div class="card"><h3 class="section-title">Low stock</h3>${low.length?`<div class="table-wrap"><table class="table"><tr><th>Ingredient</th><th>Stock</th><th>Min</th></tr>${low.map(i=>`<tr><td>${esc(i.name)}</td><td>${Number(i.stockQty).toFixed(2)} ${esc(i.unit)}</td><td>${Number(i.minStock).toFixed(2)} ${esc(i.unit)}</td></tr>`).join('')}</table></div>`:'<div class="success">No low-stock items.</div>'}</div>
  </div>
  <div class="grid two" style="margin-top:16px">
    <div class="card"><h3 class="section-title">Recipe costing snapshot</h3><div class="table-wrap"><table class="table"><tr><th>Drink</th><th>Cost</th><th>Price</th><th>Food Cost</th></tr>${data.menu.slice(0,8).map(m=>{const c=drinkCost(m.name);return `<tr><td>${esc(m.name)}</td><td class="money">${money(c)}</td><td class="money">${money(m.price)}</td><td>${m.price?pct(c/m.price*100):'0.0%'}</td></tr>`}).join('')}</table></div></div>
    <div class="card"><h3 class="section-title">Quick actions</h3><div class="toolbar"><button class="btn primary" data-go="pos">Open POS</button><button class="btn" data-go="recipes">Create Recipe</button><button class="btn" data-go="purchases">Record Purchase</button><button class="btn" data-go="ingredients">Update Ingredient Cost</button></div><div class="muted mini">All data is stored locally in this browser. Use Backup/Restore in Settings before changing devices.</div></div>
  </div>`;
 },
 pos(){
  const cats=[...new Set(data.menu.map(m=>m.category||'Other'))];
  return `<div class="pos-grid"><div><div class="toolbar no-print"><input class="input" id="posSearch" placeholder="Search menu..." style="max-width:320px"><select class="select" id="posCategory" style="max-width:180px"><option value="">All categories</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="menu-grid" id="posMenu">${menuCards()}</div></div><div class="card cart"><h3 class="section-title">Current Order</h3>${cart.length?cart.map((it,idx)=>`<div class="cart-row"><div><div style="font-weight:700">${esc(it.name)}</div><div class="mini muted">${money(it.price)} each</div></div><div class="cart-actions"><div class="qtybox"><button data-cart="dec" data-idx="${idx}">−</button><span>${it.qty}</span><button data-cart="inc" data-idx="${idx}">+</button></div><button class="btn small danger" data-cart="remove" data-idx="${idx}">x</button></div></div>`).join(''):'<div class="empty">No items.</div>'}<div class="summary"><div class="summary-line"><span>Subtotal</span><strong>${money(cart.reduce((s,i)=>s+i.price*i.qty,0))}</strong></div><div class="summary-line"><span>Discount</span><input class="input" id="posDiscount" type="number" min="0" step="0.01" value="0" style="max-width:120px;text-align:right"></div><div class="summary-line total"><span>Total</span><span>${money(cart.reduce((s,i)=>s+i.price*i.qty,0)-Number(document.getElementById('posDiscount')?.value||0))}</span></div><div class="summary-line"><span>Payment</span><select class="select" id="posPayment" style="max-width:130px"><option>Cash</option><option>Card</option><option>QR</option><option>Other</option></select></div><button class="btn primary" id="completeSale" style="width:100%;margin-top:10px" ${cart.length?'':'disabled'}>Complete Sale</button></div></div></div>`;
 },
 recipes(){
  const drinks=[...new Set(data.recipes.map(r=>r.drink))].sort();
  return `<div class="toolbar"><button class="btn primary" id="newRecipe">New Recipe</button><div class="spacer"></div><input class="input" id="recipeSearch" placeholder="Search drink..." style="max-width:260px"></div><div class="table-wrap"><table class="table"><tr><th>Drink</th><th>Ingredients</th><th>Recipe Cost</th><th>Menu Price</th><th>Food Cost</th><th></th></tr>${drinks.map(d=>{const m=menuItem(d),c=drinkCost(d),p=m?.price||0;return `<tr><td>${esc(d)}</td><td>${recipeRows(d).length}</td><td class="money">${money(c)}</td><td class="money">${money(p)}</td><td>${p?pct(c/p*100):'-'}</td><td><button class="btn small" data-edit-recipe="${esc(d)}">Edit</button></td></tr>`}).join('')}</table></div>`;
 },
 ingredients(){return `<div class="toolbar"><button class="btn primary" id="newIngredient">Add Ingredient</button><div class="spacer"></div><input class="input" id="ingredientSearch" placeholder="Search ingredient..." style="max-width:260px"></div><div class="table-wrap"><table class="table"><tr><th>Ingredient</th><th>Unit</th><th>Purchase Qty</th><th>Purchase Cost</th><th>Cost/Unit</th><th>Current Stock</th><th>Min Stock</th><th></th></tr>${data.ingredients.map(i=>`<tr><td>${esc(i.name)}</td><td>${esc(i.unit)}</td><td>${Number(i.purchaseQty).toFixed(2)}</td><td class="money">${money(i.purchaseCost)}</td><td class="money">${money(unitCost(i.name))}</td><td>${Number(i.stockQty).toFixed(2)}</td><td>${Number(i.minStock).toFixed(2)}</td><td><button class="btn small" data-edit-ingredient="${i.id}">Edit</button></td></tr>`).join('')}</table></div>`},
 inventory(){return `<div class="toolbar"><button class="btn" id="adjustStock">Stock Adjustment</button><div class="spacer"></div><input class="input" id="inventorySearch" placeholder="Search ingredient..." style="max-width:260px"></div><div class="table-wrap"><table class="table"><tr><th>Ingredient</th><th>Stock</th><th>Unit</th><th>Min</th><th>Status</th></tr>${data.ingredients.map(i=>{const st=Number(i.stockQty);const min=Number(i.minStock);const cls=st<=0?'bad':st<=min?'warn':'good';const lab=st<=0?'Out':st<=min?'Low':'OK';return `<tr><td>${esc(i.name)}</td><td>${st.toFixed(2)}</td><td>${esc(i.unit)}</td><td>${min.toFixed(2)}</td><td><span class="badge ${cls}">${lab}</span></td></tr>`}).join('')}</table></div>`},
 purchases(){return `<div class="toolbar"><button class="btn primary" id="newPurchase">Record Purchase</button><div class="spacer"></div><div class="muted mini">Purchases increase stock and update the ingredient's latest unit cost.</div></div><div class="table-wrap"><table class="table"><tr><th>Date</th><th>Supplier</th><th>Ingredient</th><th>Qty</th><th>Unit Cost</th><th>Total</th></tr>${data.purchases.slice().reverse().map(p=>`<tr><td>${p.date}</td><td>${esc(p.supplier||'-')}</td><td>${esc(p.ingredient)}</td><td>${p.qty}</td><td class="money">${money(p.unitCost)}</td><td class="money">${money(p.qty*p.unitCost)}</td></tr>`).join('')}</table></div>`},
 expenses(){return `<div class="toolbar"><button class="btn primary" id="newExpense">Add Expense</button></div><div class="table-wrap"><table class="table"><tr><th>Date</th><th>Category</th><th>Note</th><th>Amount</th></tr>${data.expenses.slice().reverse().map(e=>`<tr><td>${e.date}</td><td>${esc(e.category)}</td><td>${esc(e.note||'')}</td><td class="money">${money(e.amount)}</td></tr>`).join('')}</table></div>`},
 waste(){return `<div class="toolbar"><button class="btn primary" id="newWaste">Record Waste</button></div><div class="table-wrap"><table class="table"><tr><th>Date</th><th>Ingredient</th><th>Qty</th><th>Cost</th><th>Reason</th></tr>${data.waste.slice().reverse().map(w=>`<tr><td>${w.date}</td><td>${esc(w.ingredient)}</td><td>${w.qty}</td><td class="money">${money(w.cost)}</td><td>${esc(w.reason||'')}</td></tr>`).join('')}</table></div>`},
 menu(){return `<div class="toolbar"><button class="btn" id="addMenuItem">Add Menu Item</button><div class="spacer"></div><div class="muted mini">Menu prices are used by POS and profit calculations.</div></div><div class="table-wrap"><table class="table"><tr><th>Drink</th><th>Category</th><th>Recipe Cost</th><th>Selling Price</th><th>Profit</th><th>Food Cost</th><th>Active</th></tr>${data.menu.map(m=>{const c=drinkCost(m.name),p=Number(m.price||0);return `<tr><td>${esc(m.name)}</td><td>${esc(m.category||'Other')}</td><td class="money">${money(c)}</td><td><input class="input menu-price" data-id="${m.id}" value="${p}" type="number" step="0.01" style="width:110px"></td><td class="money">${money(p-c)}</td><td>${p?pct(c/p*100):'-'}</td><td><input type="checkbox" class="menu-active" data-id="${m.id}" ${m.active?'checked':''}></td></tr>`}).join('')}</table></div>`},
 reports(){
  const sales=totalSales(),cogs=salesCogs(),exp=expensesTotal(),gross=sales-cogs,net=gross-exp-wasteTotal(); const byDrink={}; data.sales.forEach(o=>(o.items||[]).forEach(it=>{if(!byDrink[it.name])byDrink[it.name]={qty:0,rev:0,cost:0};byDrink[it.name].qty+=it.qty;byDrink[it.name].rev+=it.qty*it.price;byDrink[it.name].cost+=it.qty*drinkCost(it.name)}));
  return `<div class="toolbar no-print"><button class="btn primary" onclick="window.print()">Print Report</button><button class="btn" id="exportSalesCsv">Export Sales CSV</button></div><div class="grid kpi">${kpi('Total Sales',money(sales),`${data.sales.length} orders`)}${kpi('COGS',money(cogs),sales?pct(cogs/sales*100):'0.0%')}${kpi('Gross Profit',money(gross),'Sales minus recipe cost')}${kpi('Estimated Net Profit',money(net),'After expenses and waste')}</div><div class="card" style="margin-top:16px"><h3 class="section-title">Product performance</h3><div class="table-wrap"><table class="table"><tr><th>Drink</th><th>Qty Sold</th><th>Revenue</th><th>Recipe Cost</th><th>Contribution</th><th>Food Cost</th></tr>${Object.entries(byDrink).sort((a,b)=>b[1].rev-a[1].rev).map(([n,v])=>`<tr><td>${esc(n)}</td><td>${v.qty}</td><td class="money">${money(v.rev)}</td><td class="money">${money(v.cost)}</td><td class="money">${money(v.rev-v.cost)}</td><td>${v.rev?pct(v.cost/v.rev*100):'-'}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No sales yet.</td></tr>'}</table></div></div>`},
 settings(){return `<div class="grid two"><div class="card"><h3 class="section-title">Cafe settings</h3><div class="formgrid"><div class="field"><label>Café name</label><input class="input" id="setName" value="${esc(data.settings.cafeName)}"></div><div class="field"><label>Currency</label><input class="input" id="setCurrency" value="${esc(data.settings.currency)}"></div><div class="field"><label>Food cost target %</label><input class="input" id="setTarget" type="number" value="${data.settings.defaultFoodCostTarget}"></div><div class="field"><label>Tax %</label><input class="input" id="setTax" type="number" value="${data.settings.taxPercent}"></div></div><button class="btn primary" id="saveSettings" style="margin-top:12px">Save Settings</button></div><div class="card"><h3 class="section-title">Backup & Restore</h3><div class="toolbar"><button class="btn primary" id="exportBackup">Export Backup</button><label class="btn">Import Backup<input id="importBackup" type="file" accept="application/json" class="hidden"></label><button class="btn danger" id="resetDemo">Reset to Demo Data</button></div><div class="muted mini">Backups are JSON files containing ingredients, recipes, menu, sales, purchases, expenses, waste, suppliers, and settings.</div></div></div><div class="card" style="margin-top:16px"><h3 class="section-title">About Connect Cafe V1</h3><div class="muted">Offline browser-based café management prototype for Connect Cafe. Data persists locally on this device/browser. No domain or hosting is required. The data model is structured so it can later move to a server/database for multi-device use.</div><div style="margin-top:12px"><a class="btn" href="https://www.instagram.com/connectcafe2026" target="_blank" rel="noopener noreferrer">Open @connectcafe2026 on Instagram</a></div></div>`}
};
function kpi(label,value,sub){return `<div class="card"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div><div class="sub">${esc(sub)}</div></div>`}
function menuCards(){const q=(document.getElementById('posSearch')?.value||'').toLowerCase();const cat=document.getElementById('posCategory')?.value||'';return data.menu.filter(m=>m.active && (!q||m.name.toLowerCase().includes(q)) && (!cat||m.category===cat)).map(m=>`<div class="menu-item"><div class="name">${esc(m.name)}</div><div class="mini muted">${esc(m.category||'Other')}</div><div class="price">${money(m.price)}</div><button class="btn primary add-menu" data-name="${esc(m.name)}">Add</button></div>`).join('')||'<div class="empty">No menu items found.</div>'}
function bind(){
 document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{currentView=b.dataset.view;render()});
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{currentView=b.dataset.go;render()});
 if(currentView==='pos'){document.getElementById('posSearch')?.addEventListener('input',()=>document.getElementById('posMenu').innerHTML=menuCards());document.getElementById('posCategory')?.addEventListener('change',()=>document.getElementById('posMenu').innerHTML=menuCards());document.querySelectorAll('.add-menu').forEach(b=>b.onclick=()=>{const n=b.dataset.name;const ex=cart.find(x=>x.name===n);if(ex)ex.qty++;else{const m=menuItem(n);cart.push({name:n,price:Number(m.price||0),qty:1})}render()});document.querySelectorAll('[data-cart]').forEach(b=>b.onclick=()=>{const i=+b.dataset.idx;if(b.dataset.cart==='inc')cart[i].qty++;if(b.dataset.cart==='dec'){cart[i].qty--;if(cart[i].qty<=0)cart.splice(i,1)}if(b.dataset.cart==='remove')cart.splice(i,1);render()});document.getElementById('completeSale')?.addEventListener('click',completeSale)}
 document.getElementById('newIngredient')?.addEventListener('click',()=>ingredientModal());document.querySelectorAll('[data-edit-ingredient]').forEach(b=>b.onclick=()=>ingredientModal(data.ingredients.find(i=>i.id===b.dataset.editIngredient)));
 document.getElementById('newRecipe')?.addEventListener('click',()=>recipeModal());document.querySelectorAll('[data-edit-recipe]').forEach(b=>b.onclick=()=>recipeModal(b.dataset.editRecipe));
 document.getElementById('newPurchase')?.addEventListener('click',purchaseModal);document.getElementById('newExpense')?.addEventListener('click',expenseModal);document.getElementById('newWaste')?.addEventListener('click',wasteModal);document.getElementById('adjustStock')?.addEventListener('click',stockAdjustModal);document.getElementById('addMenuItem')?.addEventListener('click',menuItemModal);
 document.querySelectorAll('.menu-price').forEach(i=>i.addEventListener('change',()=>{const m=data.menu.find(x=>x.id===i.dataset.id);m.price=Number(i.value||0);save();render()}));document.querySelectorAll('.menu-active').forEach(i=>i.addEventListener('change',()=>{const m=data.menu.find(x=>x.id===i.dataset.id);m.active=i.checked;save()}));
 document.getElementById('saveSettings')?.addEventListener('click',()=>{data.settings.cafeName=document.getElementById('setName').value;data.settings.currency=document.getElementById('setCurrency').value;data.settings.defaultFoodCostTarget=Number(document.getElementById('setTarget').value||35);data.settings.taxPercent=Number(document.getElementById('setTax').value||0);save();render()});
 document.getElementById('exportBackup')?.addEventListener('click',exportBackup);document.getElementById('importBackup')?.addEventListener('change',importBackup);document.getElementById('resetDemo')?.addEventListener('click',()=>{if(confirm('Reset all local data to the original demo data?')){data=JSON.parse(JSON.stringify(SEED));save();cart=[];render()}});document.getElementById('exportSalesCsv')?.addEventListener('click',exportSalesCsv);
}
function openModal(title,body,footer=''){document.getElementById('modalBox').innerHTML=`<div class="modal-head"><h3 style="margin:0">${esc(title)}</h3><button class="btn" onclick="closeModal()">Close</button></div>${body}${footer}`;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function ingredientModal(item){const i=item||{id:uid('ing'),name:'',unit:'g',purchaseQty:1000,purchaseCost:100,stockQty:1000,minStock:100};openModal(item?'Edit Ingredient':'Add Ingredient',`<div class="formgrid"><div class="field"><label>Name</label><input class="input" id="mi_name" value="${esc(i.name)}"></div><div class="field"><label>Unit</label><input class="input" id="mi_unit" value="${esc(i.unit)}"></div><div class="field"><label>Purchase Qty</label><input class="input" id="mi_qty" type="number" step="0.01" value="${i.purchaseQty}"></div><div class="field"><label>Purchase Cost</label><input class="input" id="mi_cost" type="number" step="0.01" value="${i.purchaseCost}"></div><div class="field"><label>Current Stock</label><input class="input" id="mi_stock" type="number" step="0.01" value="${i.stockQty}"></div><div class="field"><label>Minimum Stock</label><input class="input" id="mi_min" type="number" step="0.01" value="${i.minStock}"></div></div><div style="margin-top:12px">Cost per unit: <strong id="mi_preview">${money(unitCost(i.name))}</strong></div>`,`<div class="toolbar" style="margin-top:16px"><div class="spacer"></div>${item?'<button class="btn danger" id="delIng">Delete</button>':''}<button class="btn primary" id="saveIng">Save</button></div>`);document.getElementById('saveIng').onclick=()=>{const x={id:i.id,name:document.getElementById('mi_name').value.trim(),unit:document.getElementById('mi_unit').value.trim()||'unit',purchaseQty:Number(document.getElementById('mi_qty').value||0),purchaseCost:Number(document.getElementById('mi_cost').value||0),stockQty:Number(document.getElementById('mi_stock').value||0),minStock:Number(document.getElementById('mi_min').value||0)};if(!x.name){alert('Ingredient name is required.');return}const old=data.ingredients.find(z=>z.id===x.id);if(old)Object.assign(old,x);else data.ingredients.push(x);save();closeModal();render()};document.getElementById('delIng')?.addEventListener('click',()=>{if(confirm('Delete ingredient?')){data.ingredients=data.ingredients.filter(z=>z.id!==i.id);data.recipes=data.recipes.filter(r=>r.ingredient!==i.name);save();closeModal();render()}})}
function recipeModal(drinkName){const existing=drinkName?recipeRows(drinkName):[];const name=drinkName||'';const m=menuItem(name);const rowHTML=r=>`<div class="formgrid recipe-row"><div class="field" style="grid-column:span 2"><label>Ingredient</label><select class="select ri_ing">${data.ingredients.map(i=>`<option ${i.name===r.ingredient?'selected':''}>${esc(i.name)}</option>`).join('')}</select></div><div class="field"><label>Qty</label><input class="input ri_qty" type="number" step="0.01" value="${r.qty}"></div><div class="field"><label>&nbsp;</label><button class="btn danger ri_del">Remove</button></div></div>`;openModal(drinkName?'Edit Recipe':'New Recipe',`<div class="formgrid"><div class="field"><label>Drink name</label><input class="input" id="r_name" value="${esc(name)}" ${drinkName?'readonly':''}></div><div class="field"><label>Menu price</label><input class="input" id="r_price" type="number" step="0.01" value="${m?.price||200}"></div><div class="field"><label>Category</label><input class="input" id="r_cat" value="${esc(m?.category||'Other')}"></div></div><div style="margin-top:16px"><div class="toolbar"><strong>Recipe ingredients</strong><div class="spacer"></div><button class="btn" id="addRecipeRow">Add Ingredient</button></div><div id="recipeRows">${(existing.length?existing:[{ingredient:data.ingredients[0]?.name||'',qty:1}]).map(rowHTML).join('')}</div></div><div class="card" style="margin-top:12px;background:#f8fafc">Current recipe cost: <strong id="recipeLiveCost">${money(drinkName?drinkCost(drinkName):0)}</strong></div>`,`<div class="toolbar" style="margin-top:16px"><div class="spacer"></div>${drinkName?'<button class="btn danger" id="delRecipe">Delete Recipe</button>':''}<button class="btn primary" id="saveRecipe">Save Recipe</button></div>`);const refreshCost=()=>{let c=0;document.querySelectorAll('.recipe-row').forEach(row=>{const ing=row.querySelector('.ri_ing').value;const q=Number(row.querySelector('.ri_qty').value||0);c+=q*unitCost(ing)});document.getElementById('recipeLiveCost').textContent=money(c)};document.querySelectorAll('.ri_qty,.ri_ing').forEach(e=>e.addEventListener('input',refreshCost));document.querySelectorAll('.ri_del').forEach(b=>b.onclick=()=>{b.closest('.recipe-row').remove();refreshCost()});document.getElementById('addRecipeRow').onclick=()=>{const temp=document.createElement('div');temp.innerHTML=rowHTML({ingredient:data.ingredients[0]?.name||'',qty:1});const row=temp.firstElementChild;document.getElementById('recipeRows').appendChild(row);row.querySelector('.ri_del').onclick=()=>{row.remove();refreshCost()};row.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',refreshCost))};document.getElementById('saveRecipe').onclick=()=>{const n=document.getElementById('r_name').value.trim();if(!n){alert('Drink name is required.');return}data.recipes=data.recipes.filter(r=>r.drink!==n);document.querySelectorAll('.recipe-row').forEach(row=>data.recipes.push({drink:n,ingredient:row.querySelector('.ri_ing').value,qty:Number(row.querySelector('.ri_qty').value||0)}));let mm=menuItem(n);if(!mm){mm={id:uid('menu'),name:n,price:Number(document.getElementById('r_price').value||200),category:document.getElementById('r_cat').value||'Other',active:true};data.menu.push(mm)}else{mm.price=Number(document.getElementById('r_price').value||mm.price);mm.category=document.getElementById('r_cat').value||mm.category}save();closeModal();render()};document.getElementById('delRecipe')?.addEventListener('click',()=>{if(confirm('Delete this recipe and keep menu item?')){data.recipes=data.recipes.filter(r=>r.drink!==drinkName);save();closeModal();render()}});}

function salesForLastDays(n=7){

    document.querySelectorAll('[data-cart]').forEach(b=>b.onclick=()=>{const i=+b.dataset.idx;if(b.dataset.cart==='inc')cart[i].qty++;if(b.dataset.cart==='dec'){cart[i].qty--;if(cart[i].qty<=0)cart.splice(i,1)}if(b.dataset.cart==='remove')cart.splice(i,1);setTableOrder(currentTableName,cart);render()});
    document.getElementById('clearTableOrder')?.addEventListener('click',()=>{if(confirm(`Clear the open order on ${currentTableName}?`)){delete data.openOrders[currentTableName];cart=[];save();render()}});
    document.getElementById('posDiscount')?.addEventListener('input',()=>{const st=cart.reduce((s,i)=>s+i.price*i.qty,0);const d=Math.max(0,Number(document.getElementById('posDiscount').value||0));const el=document.getElementById('posTotal');if(el)el.textContent=money(Math.max(0,st-d))});
    document.getElementById('completeSale')?.addEventListener('click',completeSale);
  }
  document.getElementById('newIngredient')?.addEventListener('click',()=>ingredientModal());
  document.querySelectorAll('[data-edit-ingredient]').forEach(b=>b.onclick=()=>ingredientModal(data.ingredients.find(i=>i.id===b.dataset.editIngredient)));
  document.getElementById('newRecipe')?.addEventListener('click',()=>recipeModal());
  document.querySelectorAll('[data-edit-recipe]').forEach(b=>b.onclick=()=>recipeModal(b.dataset.editRecipe));
  document.getElementById('newPurchase')?.addEventListener('click',purchaseModal); document.getElementById('newExpense')?.addEventListener('click',expenseModal); document.getElementById('newWaste')?.addEventListener('click',wasteModal); document.getElementById('adjustStock')?.addEventListener('click',stockAdjustModal); document.getElementById('addMenuItem')?.addEventListener('click',menuItemModal);
  document.querySelectorAll('.menu-price').forEach(i=>i.addEventListener('change',()=>{const m=data.menu.find(x=>x.id===i.dataset.id);m.price=Number(i.value||0);save();render()}));
  document.querySelectorAll('.menu-active').forEach(i=>i.addEventListener('change',()=>{const m=data.menu.find(x=>x.id===i.dataset.id);m.active=i.checked;save()}));
  document.getElementById('saveSettings')?.addEventListener('click',()=>{data.settings.cafeName=document.getElementById('setName').value;data.settings.currency=document.getElementById('setCurrency').value;data.settings.defaultFoodCostTarget=Number(document.getElementById('setTarget').value||35);data.settings.taxPercent=Number(document.getElementById('setTax').value||0);save();render()});
  document.getElementById('exportBackup')?.addEventListener('click',exportBackup); document.getElementById('importBackup')?.addEventListener('change',importBackup); document.getElementById('resetDemo')?.addEventListener('click',()=>{if(confirm('Reset all local data to the original demo data?')){data=JSON.parse(JSON.stringify(SEED));data.tables=Array.from({length:12},(_,i)=>({id:'table_'+(i+1),name:'Table '+(i+1),active:true}));data.openOrders={};save();cart=[];currentTableName='Table 1';render()}}); document.getElementById('exportSalesCsv')?.addEventListener('click',exportSalesCsv);
}
bind=enhancedBind;


importBackup = function(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.ingredients||!x.recipes)throw Error('Invalid backup');data=x;data.tables=data.tables?.length?data.tables:Array.from({length:12},(_,i)=>({id:'table_'+(i+1),name:'Table '+(i+1),active:true}));data.openOrders=data.openOrders||{};data.sales=data.sales||[];data.purchases=data.purchases||[];data.expenses=data.expenses||[];data.waste=data.waste||[];data.menu=data.menu||[];data.settings=data.settings||JSON.parse(JSON.stringify(SEED.settings));currentTableName=data.tables.find(t=>t.active!==false)?.name||'Takeaway';cart=JSON.parse(JSON.stringify(tableOrder(currentTableName)));save();render();alert('Backup imported successfully.')}catch(err){alert('Invalid backup file.')}};r.readAsText(f)};
exportSalesCsv = function(){let csv='Date,Time,Table,Order,Drink,Qty,Price,Total,Payment,Note\n';data.sales.forEach(o=>(o.items||[]).forEach(it=>{const vals=[o.date,o.time,o.table||'',o.id,it.name,it.qty,it.price,it.qty*it.price,o.payment||'',o.note||''];csv+=vals.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')+'\n'}));download(`sales-${todayKey()}.csv`,csv,'text/csv')};

window.closeModal=closeModal;
window.addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
render();
</script>
</body></html>
